name: Article checks

on:
  pull_request:
    paths:
      - "app/writing/**"
      - "components/articles/**"
      - "data/posts.ts"
      - ".github/workflows/article-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint writing and article code
        run: |
          paths=(app/writing data/posts.ts)
          if [ -d components/articles ]; then paths+=(components/articles); fi
          pnpm exec eslint "${paths[@]}"
      - name: Build
        run: pnpm build
